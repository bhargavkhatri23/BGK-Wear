name: Build Android App Bundle

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm install --force
          npm install @capacitor/core @capacitor/cli @capacitor/android --force
          npx cap init BjyWear com.bgkwear.app --web-dir . || true
          
          npx cap add android || true
          npx cap sync android

          # AAPT2 एरर देने वाली ख़राब mipmap और drawable फ़ाइलों को साफ़ करें
          rm -rf android/app/src/main/res/mipmap-*
          rm -rf android/app/src/main/res/drawable*

          # Android manifest के लिए ज़रूरी न्यूनतम वैलिड रिसोर्स फ़ोल्डर तैयार करें
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          # 1. Valid Dummy Splash Screen XML
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FFFFFF"/></shape>' > android/app/src/main/res/drawable/splash.xml

          # 2. Valid Dummy Launcher Icon XML
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#3880FF"/></shape>' > android/app/src/main/res/drawable/ic_launcher_background.xml
          
          # Adaptive Icon Config XMLs
          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/splash"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/splash"/>
          </adaptive-icon>
          EOF

      - name: Build Android App Bundle
        run: |
          cd android
          rm -rf gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          wget https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip
          export PATH=$PWD/gradle-8.13/bin:$PATH
          gradle bundleRelease --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
