name: Build BGK-Wear APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm install --force
          npm install @capacitor/core @capacitor/cli @capacitor/android --force
          npx cap init BjyWear com.bgkwear.app --web-dir . || true          
          npx cap add android || true
          npx cap sync android

          # Setup proper App Launcher Icon and Splash for Android
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          # Remove conflicting resource files to prevent merge failure
          rm -f android/app/src/main/res/drawable/splash.png
          rm -f android/app/src/main/res/drawable/splash.xml

          # Create clean resource files
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1E1E2E"/></shape>' > android/app/src/main/res/drawable/ic_launcher_background.xml
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#3880FF"/><corners android:radius="100dp"/></shape>' > android/app/src/main/res/drawable/splash_bg.xml
          
          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/splash_bg"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/splash_bg"/>
          </adaptive-icon>
          EOF

          # Ensure valid MainActivity
          cat << 'EOF' > android/app/src/main/java/com/bgkwear/app/MainActivity.java
          package com.bgkwear.app;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {}
          EOF

      - name: Fix Build Gradle & Generate Fresh Keystore
        run: |
          cd android
          
          # Generate fresh matching keystore first
          rm -f app/bgk-release-key.jks
          keytool -genkey -v -keystore app/bgk-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias bgkwear -storepass android123 -keypass android123 -dname "CN=BGK, OU=Wear, O=App, L=City, ST=State, C=IN"

          # Completely rewrite build.gradle safely using Python to avoid any brace mismatch
          cat << 'EOF' > fix.py
          import re

          gradle_path = "app/build.gradle"
          with open(gradle_path, "r") as f:
              lines = f.readlines()

          new_lines = []
          skip_block = False
          brace_count = 0

          # Filter out old buildTypes and signingConfigs to prevent duplication or syntax corruption
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("signingConfigs") or stripped.startswith("buildTypes"):
                  skip_block = True
                  brace_count = line.count("{") - line.count("}")
                  if brace_count == 0:
                      skip_block = False
                  continue
              
              if skip_block:
                  brace_count += line.count("{") - line.count("}")
                  if brace_count <= 0:
                      skip_block = False
                  continue
              
              new_lines.append(line)

          content = "".join(new_lines)

          # Inject proper signingConfigs and buildTypes right before the last closing brace of 'android { ... }'
          injection = """
              signingConfigs {
                  release {
                      storeFile file('bgk-release-key.jks')
                      storePassword 'android123'
                      keyAlias 'bgkwear'
                      keyPassword 'android123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          """

          # Find the android block closing brace and insert before it
          last_brace_idx = content.rfind("}")
          if last_brace_idx != -1:
              content = content[:last_brace_idx] + injection + "\n" + content[last_brace_idx:]

          with open(gradle_path, "w") as f:
              f.write(content)
          print("Successfully regenerated clean build.gradle")
          EOF

          python3 fix.py

          mkdir -p gradle/wrapper
          wget https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip
          export PATH=$PWD/gradle-8.13/bin:$PATH

          # Build APK and Bundle successfully
          gradle assembleDebug bundleRelease --stacktrace

          # Rename Debug APK for clarity
          cd app/build/outputs/apk/debug/
          mv app-debug.apk BGK-WEAR.apk

      - name: Upload APK Artifact (For Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: BGK-WEAR-APK
          path: android/app/build/outputs/apk/debug/BGK-WEAR.apk

      - name: Upload AAB Artifact (For Play Store Upload)
        uses: actions/upload-artifact@v4
        with:
          name: BGK-WEAR-Release-Bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
