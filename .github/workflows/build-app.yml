name: Build Android App Bundle

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm install --force
          npm install @capacitor/core @capacitor/cli @capacitor/android --force
          npx cap init BjyWear com.bjywear.app --web-dir . || true
          
          # AAPT2 एरर से बचने के लिए करप्ट/अमान्य डिफ़ॉल्ट आइकॉन फ़ाइलों को साफ़ करें
          rm -rf android/app/src/main/res/mipmap-*
          
          npx cap add android || true
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App Bundle
        run: |
          cd android
          rm -rf gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          wget https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip
          export PATH=$PWD/gradle-8.13/bin:$PATH
          gradle bundleRelease --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
