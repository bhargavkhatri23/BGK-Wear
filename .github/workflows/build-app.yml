name: Build BGK-Wear APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm install --force
          npm install @capacitor/core @capacitor/cli @capacitor/android --force
          
          # Ensure a valid www folder exists for Capacitor to bundle web assets properly
          mkdir -p www
          if [ ! -f "index.html" ] && [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>BGK Wear</title></head><body style="background:#1E1E2E;color:white;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;"><h1>BGK Wear App Working</h1></body></html>' > index.html
          fi
          
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          elif [ -f "www/index.html" ] && [ ! -f "index.html" ]; then
            cp www/index.html index.html
          fi

          npx cap init BjyWear com.bgkwear.app --web-dir www || true          
          npx cap add android || true
          
          # Force copy web assets into Android project assets folder to prevent crash on open
          npx cap sync android
          mkdir -p android/app/src/main/assets/public
          cp -rf www/* android/app/src/main/assets/public/ || true

          # Clean up conflicting legacy generated folders
          rm -rf android/app/src/main/res/drawable-*
          rm -rf android/app/src/main/res/mipmap-*

          # Create clean resource folders
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          # Create required valid drawable and splash resources
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1E1E2E"/></shape>' > android/app/src/main/res/drawable/ic_launcher_background.xml
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#3880FF"/><corners android:radius="100dp"/></shape>' > android/app/src/main/res/drawable/splash_bg.xml
          
          # Generate tiny valid PNG file for splash
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > android/app/src/main/res/drawable/splash.png

          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/splash_bg"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/splash_bg"/>
          </adaptive-icon>
          EOF

          # Ensure valid MainActivity
          cat << 'EOF' > android/app/src/main/java/com/bgkwear/app/MainActivity.java
          package com.bgkwear.app;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {}
          EOF

      - name: Fix Build Gradle & Generate Fresh Keystore
        run: |
          cd android
          
          # Generate fresh matching keystore first
          rm -f app/bgk-release-key.jks
          keytool -genkey -v -keystore app/bgk-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias bgkwear -storepass android123 -keypass android123 -dname "CN=BGK, OU=Wear, O=App, L=City, ST=State, C=IN"

          # Bulletproof Python script to clean and correctly structure build.gradle
          cat << 'EOF' > fix.py
          import re

          gradle_path = "app/build.gradle"
          with open(gradle_path, "r") as f:
              lines = f.readlines()

          clean_lines = []
          skip = False
          brace_depth = 0

          for line in lines:
              stripped = line.strip()
              if not skip and (stripped.startswith("signingConfigs") or stripped.startswith("buildTypes")):
                  skip = True
                  brace_depth = line.count("{") - line.count("}")
                  if brace_depth <= 0:
                      skip = False
                  continue
              
              if skip:
                  brace_depth += line.count("{") - line.count("}")
                  if brace_depth <= 0:
                      skip = False
                  continue
              
              clean_lines.append(line)

          content = "".join(clean_lines)

          injection = """
          
              signingConfigs {
                  release {
                      storeFile file('bgk-release-key.jks')
                      storePassword 'android123'
                      keyAlias 'bgkwear'
                      keyPassword 'android123'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          """

          match = re.search(r'android\s*\{', content)
          if match:
              idx = match.end()
              content = content[:idx] + injection + content[idx:]
          else:
              raise Exception("Could not find 'android {' block in build.gradle")

          with open(gradle_path, "w") as f:
              f.write(content)
          print("Successfully fixed and structured build.gradle")
          EOF

          python3 fix.py

          mkdir -p gradle/wrapper
          wget https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip
          export PATH=$PWD/gradle-8.13/bin:$PATH

          # Build APK and Bundle successfully
          gradle assembleDebug bundleRelease --stacktrace

          # Rename Debug APK for clarity
          cd app/build/outputs/apk/debug/
          mv app-debug.apk BGK-WEAR.apk

      - name: Upload APK Artifact (For Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: BGK-WEAR-APK
          path: android/app/build/outputs/apk/debug/BGK-WEAR.apk

      - name: Upload AAB Artifact (For Play Store Upload)
        uses: actions/upload-artifact@v4
        with:
          name: BGK-WEAR-Release-Bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
