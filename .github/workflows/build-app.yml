name: Build Android App Bundle

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies & Capacitor
        run: |
          npm install --force
          npm install @capacitor/core @capacitor/cli @capacitor/android --force
          npx cap init BjyWear com.bjywear.app --web-dir . || true
          npx cap add android || true

      - name: Fix Gradle Wrapper Jar
        run: |
          rm -rf android/gradle/wrapper/gradle-wrapper.jar
          mkdir -p android/gradle/wrapper
          curl -L -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/subprojects/wrapper/src/main/resources/gradle-wrapper.jar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App Bundle (AAB) with Stacktrace
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
