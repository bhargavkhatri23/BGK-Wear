<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="60%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Lime Green Gradients -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF4D" />
      <stop offset="30%" stop-color="#C4F400" />
      <stop offset="70%" stop-color="#A6D800" />
      <stop offset="100%" stop-color="#80A800" />
    </linearGradient>

    <linearGradient id="limeBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4F400" />
      <stop offset="50%" stop-color="#8BB500" />
      <stop offset="100%" stop-color="#C4F400" />
    </linearGradient>

    <!-- Metallic Silver / White Gradients -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F0F0F0" />
      <stop offset="100%" stop-color="#D0D4DC" />
    </linearGradient>

    <!-- Subtle Shadows & Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base App Tile Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGlow)" />
  
  <!-- Outer Neon Lime Accent Border -->
  <rect x="36" y="36" width="952" height="952" rx="190" fill="none" stroke="url(#limeBorderGrad)" stroke-width="4" stroke-opacity="0.85" />

  <g filter="url(#dropShadow)">
    <!-- Outer Arc Crest (Upper Right Silver Arc) -->
    <path d="M 570,225 A 330,330 0 0,1 820,440" fill="none" stroke="url(#silverGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Outer Arc Crest (Upper Left Lime Arc) -->
    <path d="M 210,430 A 330,330 0 0,1 450,230" fill="none" stroke="url(#limeGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Bottom Left Lime Crescent -->
    <path d="M 200,600 A 330,330 0 0,0 490,835" fill="none" stroke="url(#limeGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Bottom Right Silver Crescent -->
    <path d="M 535,835 A 330,330 0 0,0 790,670" fill="none" stroke="url(#silverGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Stylized T-Shirt Background Shape Inside Crest -->
    <path d="M 270,410 Q 512,300 754,410 L 730,550 Q 512,580 294,550 Z" fill="#121212" stroke="#1f1f1f" stroke-width="3" />

    <!-- Lime Collar Detail on T-Shirt -->
    <path d="M 390,300 Q 512,395 634,300 Q 512,340 390,300 Z" fill="url(#limeGrad)" />
    <path d="M 405,305 Q 512,380 619,305" fill="none" stroke="#121212" stroke-width="10" />

    <!-- Clothes Hanger Hook & Body (White / Silver Wire) -->
    <!-- Hook -->
    <path d="M 512,210 C 512,145 470,125 495,140 C 530,160 520,210 512,215" fill="none" stroke="url(#silverGrad)" stroke-width="16" stroke-linecap="round" />
    <circle cx="488" cy="148" r="8" fill="url(#silverGrad)" />

    <!-- Hanger Triangular Shoulder Struts -->
    <path d="M 512,215 L 395,290 L 629,290 Z" fill="none" stroke="url(#silverGrad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 380,296 Q 512,240 644,296" fill="none" stroke="url(#silverGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Bold Central Acronym BGK (Italicized, 3D Sculpted) -->
    <!-- 'B' (White / Silver) -->
    <g transform="skewX(-10)">
      <text x="210" y="630" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="250" fill="url(#silverGrad)" letter-spacing="-5" stroke="#111" stroke-width="6">B</text>
    </g>

    <!-- 'G' (Electric Lime Green Gradient) -->
    <g transform="skewX(-10)">
      <text x="390" y="630" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="250" fill="url(#limeGrad)" letter-spacing="-5" stroke="#111" stroke-width="6">G</text>
    </g>

    <!-- 'K' (White / Silver) -->
    <g transform="skewX(-10)">
      <text x="635" y="630" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="250" fill="url(#silverGrad)" letter-spacing="-5" stroke="#111" stroke-width="6">K</text>
    </g>

    <!-- 'W E A R' Wordmark -->
    <text x="512" y="730" font-family="'Arial Black', 'Montserrat', sans-serif" font-weight="900" font-size="58" fill="url(#limeGrad)" text-anchor="middle" letter-spacing="24">WEAR</text>

    <!-- Tagline: "— WEAR YOUR CONFIDENCE. —" -->
    <g opacity="0.9">
      <line x1="300" y1="775" x2="340" y2="775" stroke="url(#limeGrad)" stroke-width="3" stroke-linecap="round" />
      <text x="512" y="780" font-family="'Montserrat', 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="19" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">WEAR YOUR CONFIDENCE.</text>
      <line x1="684" y1="775" x2="724" y2="775" stroke="url(#limeGrad)" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>
