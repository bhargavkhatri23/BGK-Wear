<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8" />
      <stop offset="50%" stop-color="#fce7f3" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f2089" />
      <stop offset="100%" stop-color="#6d052a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGrad)" />

  <!-- Subtle luxury border -->
  <rect x="24" y="24" width="552" height="752" rx="28" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Decorative center badge -->
  <circle cx="300" cy="340" r="100" fill="#ffffff" filter="drop-shadow(0 10px 25px rgba(109, 5, 42, 0.1))" />

  <!-- Dress / Hanger Icon -->
  <g transform="translate(250, 290) scale(1.6)" fill="none" stroke="url(#berryGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hanger hook -->
    <path d="M 31 10 C 31 5 27 2 24 5 C 21 8 25 15 31 18 L 12 28 L 50 28 Z" />
    <!-- Outfit Silhouette -->
    <path d="M 18 28 Q 14 45 10 58 L 52 58 Q 48 45 44 28" fill="url(#berryGrad)" fill-opacity="0.12" />
    <path d="M 24 35 Q 31 38 38 35" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="31" cy="46" r="2" fill="url(#goldGrad)" />
  </g>

  <!-- Offline status pill -->
  <g transform="translate(210, 480)">
    <rect width="180" height="32" rx="16" fill="#6d052a" />
    <circle cx="24" cy="16" r="4" fill="#4ade80" />
    <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">SAVED OFFLINE</text>
  </g>

  <!-- Title & Subtext -->
  <text x="300" y="545" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="800" fill="#6d052a" letter-spacing="2">BGK WEAR</text>
  <text x="300" y="575" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#831843" letter-spacing="0.5">Heritage Couture Outfit</text>
  <text x="300" y="605" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9ca3af">Cached in your offline wardrobe</text>
</svg>
